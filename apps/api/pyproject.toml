[project]
name = "sentinel-api"
version = "0.1.0"
description = "Sentinel modular monolith API and mission services"
requires-python = ">=3.11"
readme = "../../README.md"

[tool.pytest.ini_options]
pythonpath = [".", "../../simulator"]
testpaths = ["tests", "../../simulator/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

